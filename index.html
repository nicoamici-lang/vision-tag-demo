<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Visión Tag · Beneficio</title><style>:root{--bg:#06100b;--card:#0c1a12;--line:#1b3b28;--green:#37e67a;--text:#f5fff8;--muted:#9ab5a4}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#143923,#06100b 48%,#020604);color:var(--text);font-family:Inter,system-ui,Arial;padding:22px;display:flex;justify-content:center;align-items:center}.wrap{width:min(520px,100%)}.brand{display:flex;align-items:center;gap:12px;margin-bottom:18px}.logo{width:58px;height:58px;border:2px solid var(--green);border-radius:18px;display:grid;place-items:center;font-weight:950;font-size:23px;box-shadow:0 0 28px #37e67a33}.brand h1{font-size:23px;margin:0}.brand p{margin:3px 0;color:var(--muted);font-size:13px}.card{background:#0c1a12e8;border:1px solid var(--line);border-radius:26px;padding:25px;box-shadow:0 25px 80px #0009}.status{display:inline-flex;gap:8px;align-items:center;padding:9px 13px;border-radius:999px;border:1px solid #2d8750;background:#123b23;color:#c5ffd7;font-weight:850;font-size:13px}.dot{width:8px;height:8px;border-radius:50%;background:var(--green)}.id{color:var(--muted);font-size:13px;margin-top:15px}.campaign{margin-top:24px;color:#b8d7c2;font-size:13px;letter-spacing:.14em;text-transform:uppercase;font-weight:850}.promo{font-size:46px;line-height:1;margin:8px 0 14px;font-weight:950;letter-spacing:-.045em}.desc{color:var(--muted);line-height:1.55;margin:0}.meta{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px}.box{border:1px solid var(--line);background:#08130d;padding:12px;border-radius:14px}.box small{display:block;color:#75927e;margin-bottom:5px}.box strong{font-size:14px}.save{width:100%;border:0;background:var(--green);color:#05220f;font-weight:950;padding:16px;border-radius:15px;margin-top:20px;font-size:15px;cursor:pointer}.saved{background:#173c26;color:#caffd8;border:1px solid #2f8650}.fine{font-size:11px;color:#698673;text-align:center;margin-top:13px}.bad{color:#ffd1d1}.home a{display:block;color:var(--text);text-decoration:none;border:1px solid var(--line);padding:13px;border-radius:13px;margin-top:10px}</style></head><body><main class="wrap"><div class="brand"><div class="logo">VT</div><div><h1>VISIÓN TAG</h1><p>Beneficios inteligentes</p></div></div><section class="card" id="app">Validando Visión Tag...</section></main><script>const id=(new URLSearchParams(location.search).get('vt')||'').trim().toUpperCase(),app=document.getElementById('app');async function run(){let d={};try{const r=await fetch('campaigns.json?v='+Date.now(),{cache:'no-store'});d=await r.json()}catch(e){app.innerHTML='<b class="bad">No se pudo cargar la promoción.</b>';return}if(!id){app.innerHTML='<div class="status"><span class="dot"></span>DEMO ACTIVA</div><h2>Escaneá un Visión Tag</h2><p class="desc">Cada VT identifica y consulta su beneficio vigente.</p><div class="home">'+Object.entries(d).map(([k,c])=>'<a href="?vt='+k+'">'+k+' · '+c.promo+'</a>').join('')+'</div>';return}const c=d[id];if(!c){app.innerHTML='<b class="bad">VT NO VÁLIDO</b>';return}const until=c.until||'Demo vigente',merchant=c.merchant||'Comercio adherido';app.innerHTML='<div class="status"><span class="dot"></span>✓ BENEFICIO VALIDADO</div><div class="id">Visión Tag: <strong>'+id+'</strong></div><div class="campaign">'+c.campaign+'</div><div class="promo">'+c.promo+'</div><p class="desc">'+c.desc+'</p><div class="meta"><div class="box"><small>Comercio</small><strong>'+merchant+'</strong></div><div class="box"><small>Vigencia</small><strong>'+until+'</strong></div></div><button class="save" id="save">GUARDAR BENEFICIO</button><div class="fine">Beneficio asociado dinámicamente a '+id+'</div>';document.getElementById('save').onclick=function(){const saved=JSON.parse(localStorage.getItem('vtBenefits')||'{}');saved[id]={...c,savedAt:new Date().toISOString()};localStorage.setItem('vtBenefits',JSON.stringify(saved));this.textContent='✓ BENEFICIO GUARDADO';this.classList.add('saved')}}run()</script></body></html>
