<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VT-20 Ancla elástica local</title><style>body{font-family:Arial;background:#07130f;color:#fff;padding:24px;text-align:center}h1{margin-top:18vh}p{font-size:18px}</style><h1>VISIÓN TAG · ENSAYO VT-20</h1><p id="m">Cargando ancla elástica local…</p><script>
(async()=>{try{
let h=await fetch('../vt-ensayo-17-seguimiento-subpixel/index.html?vt20=1',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('BASE '+r.status);return r.text()});
h=h.replaceAll('VT-17 Seguimiento subpíxel','VT-20 Ancla elástica local').replaceAll('VISIÓN TAG · ENSAYO VT-17','VISIÓN TAG · ENSAYO VT-20').replace('Seguimiento subpíxel desde la primera geometría exacta 0/36. Cámara estable de VT-16. Sólo 0/36 suma; 10/10 valida.','Ancla elástica desde el último 0/36: acompaña movimiento, escala y perspectiva local sin deformar libremente la geometría. Sólo 0/36 suma; 10/10 valida.');
// Variantes locales: traslación, microescala y perspectiva controlada de lados/esquinas.
h=h.replace(/function variants\(p\)\{.*?return out\}/s,`function variants(p){let out=[{p:p.map(z=>({...z})),label:'ANCLA PREDICHA'}];for(const u of[.5,1,1.6,2.4])for(const [dx,dy] of[[-u,0],[u,0],[0,-u],[0,u],[-u,-u],[u,-u],[u,u],[-u,u]])out.push({p:p.map(z=>({x:z.x+dx,y:z.y+dy})),label:'MOV '+u.toFixed(1)});for(const s of[.988,.994,1.006,1.012])out.push({p:hyp(p,s),label:'ESC '+s.toFixed(3)});for(const u of[.7,1.4,2.1]){for(const side of[0,1,2,3])for(const d of[-u,u]){let q=p.map(z=>({...z}));if(side===0){q[0].x+=d;q[3].x+=d}if(side===1){q[1].x+=d;q[2].x+=d}if(side===2){q[0].y+=d;q[1].y+=d}if(side===3){q[2].y+=d;q[3].y+=d}out.push({p:q,label:'BORDE '+side+' '+d.toFixed(1)})}for(let k=0;k<4;k++)for(const [dx,dy] of[[-u,0],[u,0],[0,-u],[0,u]]){let q=p.map(z=>({...z}));q[k].x+=dx;q[k].y+=dy;out.push({p:q,label:'PERS E'+(k+1)+' '+u.toFixed(1)})}}return out}`);
// Con ancla: usar el candidato cercano para predecir movimiento + cambio de escala, luego refinar localmente.
h=h.replace("if(anchor&&anchorAge<60)tries.push(...variants(anchor));if(track)for(const s of[.96,.98,1,1.02,1.04])tries.push({p:hyp(track,s),label:'TRACK '+s.toFixed(2)});for(const c of cs.slice(0,10))for(const s of[.84,.90,.96,1,1.04,1.10,1.16])tries.push({p:hyp(c.p,s),label:'GLOBAL '+s.toFixed(2)});",`if(anchor&&anchorAge<55){let ac=center(anchor),near=null,nd=1e9;for(const c of cs){let cc=center(c.p),d=Math.hypot(cc.x-ac.x,cc.y-ac.y);if(d<nd){nd=d;near=c}}let predicted=anchor.map(z=>({...z}));if(near){let nc=center(near.p),dx=nc.x-ac.x,dy=nc.y-ac.y;let aw=Math.hypot(anchor[1].x-anchor[0].x,anchor[1].y-anchor[0].y)+Math.hypot(anchor[2].x-anchor[3].x,anchor[2].y-anchor[3].y);let nw=Math.hypot(near.p[1].x-near.p[0].x,near.p[1].y-near.p[0].y)+Math.hypot(near.p[2].x-near.p[3].x,near.p[2].y-near.p[3].y);let ratio=Math.max(.94,Math.min(1.06,nw/Math.max(1,aw)));let maxMove=Math.max(10,Math.min(42,Math.sqrt(near.a)*.28));if(Math.hypot(dx,dy)<=maxMove){predicted=hyp(anchor,ratio).map(z=>({x:z.x+dx,y:z.y+dy}))}}tries.push(...variants(predicted))}else{if(track)for(const s of[.96,.98,1,1.02,1.04])tries.push({p:hyp(track,s),label:'RECUP '+s.toFixed(2)});for(const c of cs.slice(0,10))for(const s of[.84,.90,.96,1,1.04,1.10,1.16])tries.push({p:hyp(c.p,s),label:'GLOBAL '+s.toFixed(2)})}`);
h=h.replace("if(z.d.dist===0&&anchor&&t.label.startsWith('SUBPIX'))break","if(z.d.dist===0&&anchor&&(t.label.startsWith('ANCLA')||t.label.startsWith('MOV')||t.label.startsWith('ESC')||t.label.startsWith('BORDE')||t.label.startsWith('PERS')))break");
h=h.replaceAll('SUBPÍXEL ACTIVO','ANCLA ELÁSTICA ACTIVA').replaceAll('SUBPÍXEL BUSCANDO','ANCLA ELÁSTICA · REFINANDO').replaceAll('Subpíxel: esperando ancla 0/36','Ancla elástica: esperando primer 0/36').replaceAll('Subpíxel: esperando ancla 0/36','Ancla elástica: esperando primer 0/36').replaceAll('anchorAge>60','anchorAge>55').replaceAll("'/60'","'/55'").replaceAll("+'/60'","+'/55'");
document.open();document.write(h);document.close();
}catch(e){document.getElementById('m').textContent='Error al cargar VT-20: '+e.message}}
)();
</script>
