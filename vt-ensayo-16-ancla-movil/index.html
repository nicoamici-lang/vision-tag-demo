<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VT-16 Cámara Samsung</title><style>body{font-family:Arial;background:#07130f;color:white;padding:16px}main{max-width:820px;margin:auto}.box{background:#10231c;border:1px solid #315445;border-radius:14px;padding:14px;margin:12px 0}.ok{background:#234d38}.wait{background:#5c4b1d}.bad{background:#6a2340}.s{padding:10px;border-radius:9px;margin:7px 0}button{width:100%;padding:14px;border:0;border-radius:10px;font-weight:800;font-size:17px;background:#b8ff43}video{width:100%;min-height:300px;border-radius:12px;background:#000;object-fit:contain}</style><main><h1>VISIÓN TAG · ENSAYO VT-16</h1><p>Arranque de cámara trasera compatible con Samsung/Chrome. Una señal 2×2 se considera inválida y se reintenta automáticamente.</p><div class="box"><div id="cam" class="s wait">1. Cámara: esperando</div><div id="perm" class="s wait">2. Permiso: esperando acción</div><div id="mode" class="s wait">3. Modo: esperando</div></div><div class="box"><button id="go">ABRIR CÁMARA TRASERA</button></div><div class="box"><video id="v" playsinline muted autoplay></video></div></main><script>
const $=x=>document.getElementById(x);let stream=null;const sleep=ms=>new Promise(r=>setTimeout(r,ms));function S(i,t,c='wait'){let e=$(i);e.textContent=t;e.className='s '+c}function stop(){if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}$('v').srcObject=null}async function attach(s,label){stream=s;let v=$('v');v.srcObject=s;v.setAttribute('playsinline','');v.muted=true;await v.play().catch(()=>{});for(let i=0;i<40;i++){if(v.videoWidth>=160&&v.videoHeight>=120)return true;await sleep(100)}let tr=s.getVideoTracks()[0],set=tr&&tr.getSettings?tr.getSettings():{};S('mode','3. '+label+' entregó '+(v.videoWidth||0)+'×'+(v.videoHeight||0)+' · track '+(set.width||'?')+'×'+(set.height||'?'),'bad');return false}async function gum(c,label){S('mode','3. Probando '+label+'…','wait');let s=await navigator.mediaDevices.getUserMedia({audio:false,video:c});if(await attach(s,label)){S('mode','✓ 3. '+label,'ok');return true}stop();await sleep(250);return false}async function start(){try{stop();S('cam','1. Cámara: iniciando…');S('perm','2. Solicitando permiso…');if(!navigator.mediaDevices?.getUserMedia)throw new Error('getUserMedia no disponible');let ok=false;try{ok=await gum({facingMode:{exact:'environment'}},'trasera exacta')}catch(e){}if(!ok)try{ok=await gum({facingMode:'environment'},'trasera preferida')}catch(e){}if(!ok){let devices=await navigator.mediaDevices.enumerateDevices();let cams=devices.filter(d=>d.kind==='videoinput');for(let i=cams.length-1;i>=0&&!ok;i--){let d=cams[i];try{ok=await gum({deviceId:{exact:d.deviceId}},'cámara '+(d.label||('#'+(i+1))))}catch(e){}}}if(!ok)try{ok=await gum(true,'cámara predeterminada')}catch(e){}if(!ok)throw new Error('ninguna cámara entregó video real');let v=$('v');S('perm','✓ 2. Permiso de cámara concedido','ok');S('cam','✓ 1. CÁMARA ACTIVA · '+v.videoWidth+'×'+v.videoHeight,'ok')}catch(e){stop();S('cam','✕ 1. Cámara: '+(e.name||'Error')+' · '+e.message,'bad');S('perm',e.name==='NotAllowedError'?'✕ 2. Permiso bloqueado':'2. Permiso concedido, pero sin video utilizable','bad')}}$('go').addEventListener('click',start);document.addEventListener('visibilitychange',()=>{if(document.hidden)stop()});
</script>
