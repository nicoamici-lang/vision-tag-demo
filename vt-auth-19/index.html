<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VT-AUTH-19</title><style>html,body{margin:0;background:#07130f;color:#fff;font-family:Arial}#top{position:sticky;top:0;z-index:90;background:#07130f;border-bottom:1px solid #315445;padding:10px}.title{font-size:20px;font-weight:900;color:#28d17e}.state{font-size:28px;font-weight:900;margin:5px 0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.m{background:#10231c;border-radius:9px;padding:8px;text-align:center}.m b{display:block;font-size:11px;color:#a9bdb4}.n{font-size:21px;font-weight:900}.bar{height:6px;background:#294238;border-radius:5px;overflow:hidden}.bar i{display:block;height:100%;background:#b8ff43}.auth{margin-top:8px;padding:9px;border-radius:9px;font-weight:900;background:#6a2340}.auth.ok{background:#234d38}.rule{font-size:12px;margin-top:7px;color:#c8d8d0}.log{font-size:11px;color:#92aa9f;max-height:42px;overflow:auto;margin-top:5px}iframe{width:100%;height:calc(100vh - 245px);border:0}</style></head><body><div id="top"><div class="title">VISION TAG · VT-AUTH-19</div><div id="state" class="state">SEARCH</div><div id="aid">ID autenticada: —</div><div class="grid"><div class="m"><b>G · GEOMETRÍA</b><span id="g" class="n">0%</span><div class="bar"><i id="gb"></i></div></div><div class="m"><b>I · IDENTIDAD</b><span id="i" class="n">0%</span><div class="bar"><i id="ib"></i></div></div><div class="m"><b>T · TEMPORAL</b><span id="t" class="n">0%</span><div class="bar"><i id="tb"></i></div></div></div><div id="authorization" class="auth">AUTORIZACIÓN REVOCADA · PROMOCIONES BLOQUEADAS</div><div id="rule" class="rule">Una sesión sólo autoriza promociones mientras la identidad está autenticada y persistente.</div><div id="log" class="log"></div></div><iframe id="app" src="../vt-ensayo-29-recaptura-ancla/?auth19=1"></iframe><script>const f=document.getElementById('app'),q=x=>document.getElementById(x);let authId=null,lastAuth=0,lastState='',authorized=false;function pct(k,v){v=Math.max(0,Math.min(100,Math.round(v)));q(k).textContent=v+'%';q(k+'b').style.width=v+'%'}function state(s,msg){if(s!==lastState){q('log').innerHTML='<div>'+new Date().toLocaleTimeString()+' · '+s+(msg?' · '+msg:'')+'</div>'+q('log').innerHTML;lastState=s}q('state').textContent=s}function gate(on,reason,d){authorized=on;const a=q('authorization');a.className='auth'+(on?' ok':'');a.textContent=on?'AUTORIZACIÓN ACTIVA · PROMOCIONES HABILITADAS':'AUTORIZACIÓN REVOCADA · PROMOCIONES BLOQUEADAS';const enter=d?.getElementById('enter');if(enter){enter.style.display=on?'block':'none';enter.disabled=!on}if(d){const flow=d.getElementById('flow');if(flow&&!on){flow.textContent='8. AUTORIZACIÓN REVOCADA · '+reason;flow.className='s bad'}}}function monitor(){try{const d=f.contentDocument;if(!d)return requestAnimationFrame(monitor);const tx=id=>(d.getElementById(id)?.textContent||'');const tr=tx('trk'),de=tx('dec'),st=tx('st'),lo=tx('loc'),ge=tx('geo'),id=tx('id');const m=id.match(/VT-(\d{6})/),exact=/36\/36|ID válido/.test(de),persistent=/10\/10/.test(st),tracking=/SEGUIMIENTO 4\/4|MICROSEGUIMIENTO/.test(tr),recover=/RECAPTUR/.test(tr+' '+ge),candidate=/localizado/.test(lo);if(exact&&m){authId=m[0];lastAuth=Date.now();q('aid').textContent='ID autenticada: '+authId;pct('g',100);pct('i',100);pct('t',100);if(persistent){state('AUTHENTICATED','36/36 + persistencia 10/10');gate(true,'',d);q('rule').textContent='Identidad validada y persistente: operación dependiente de identidad autorizada.'}else{state('AUTHENTICATING','36/36; esperando persistencia');gate(false,'esperando persistencia 10/10',d);q('rule').textContent='ID exacta encontrada, pero todavía no alcanza el criterio de autorización.'}}else if(recover&&authId){state('REVALIDATION','barrera de identidad activa');pct('g',candidate?70:30);pct('i',Math.max(15,90-(Date.now()-lastAuth)/90));pct('t',Math.max(10,80-(Date.now()-lastAuth)/130));gate(false,'revalidación',d);q('rule').textContent='La geometría candidata no hereda autenticidad. Se revoca la autorización durante la revalidación.'}else if(tracking&&authId){state('TRACKING','G/T separados de I');const a=Date.now()-lastAuth;pct('g',95);pct('i',Math.max(45,100-a/170));pct('t',Math.max(55,100-a/240));gate(false,'tracking sin evidencia óptica actual',d);q('rule').textContent='El tracking puede continuar, pero no mantiene por sí solo una autorización dependiente de identidad.'}else if(candidate&&!authId){state('CANDIDATE');pct('g',78);pct('i',15);pct('t',25);gate(false,'candidato no autenticado',d)}else if(authId){state('SUSPENDED','sin evidencia suficiente');pct('g',15);pct('i',Math.max(5,65-(Date.now()-lastAuth)/120));pct('t',10);gate(false,'sesión suspendida',d);q('rule').textContent='Sesión '+authId+' suspendida: promociones bloqueadas hasta nueva autenticación completa.'}else{state('SEARCH');pct('g',0);pct('i',0);pct('t',0);gate(false,'buscando VT',d)}}catch(e){}requestAnimationFrame(monitor)}f.onload=()=>requestAnimationFrame(monitor);</script></body></html>
