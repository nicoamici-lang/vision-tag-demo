<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VT-AUTH-18 · Continuidad de identidad</title><style>html,body{margin:0;background:#07130f;color:#fff;font-family:Arial}#top{position:sticky;top:0;z-index:50;background:#07130f;border-bottom:1px solid #315445;padding:10px}.title{font-size:20px;font-weight:900;color:#28d17e}.state{font-size:28px;font-weight:900;margin:5px 0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.m{background:#10231c;border-radius:9px;padding:8px;text-align:center}.m b{display:block;font-size:11px;color:#a9bdb4}.n{font-size:21px;font-weight:900}.bar{height:6px;background:#294238;border-radius:5px;overflow:hidden}.bar i{display:block;height:100%;background:#b8ff43}.rule{font-size:12px;margin-top:7px;color:#c8d8d0}.log{font-size:11px;color:#92aa9f;max-height:44px;overflow:auto;margin-top:5px}iframe{width:100%;height:calc(100vh - 205px);border:0}@media(max-width:520px){iframe{height:calc(100vh - 230px)}}</style></head><body><div id="top"><div class="title">VISION TAG · VT-AUTH-18</div><div id="state" class="state">SEARCH</div><div id="aid">ID autenticada: —</div><div class="grid"><div class="m"><b>G · GEOMETRÍA</b><span id="g" class="n">0%</span><div class="bar"><i id="gb"></i></div></div><div class="m"><b>I · IDENTIDAD</b><span id="i" class="n">0%</span><div class="bar"><i id="ib"></i></div></div><div class="m"><b>T · TEMPORAL</b><span id="t" class="n">0%</span><div class="bar"><i id="tb"></i></div></div></div><div id="rule" class="rule">Continuidad geométrica ≠ continuidad autenticada.</div><div id="log" class="log"></div></div><iframe id="app" src="../vt-ensayo-29-recaptura-ancla/?auth18=1"></iframe><script>const f=document.getElementById('app'),q=x=>document.getElementById(x);let authId=null,lastAuth=0,lastState='';function pct(k,v){v=Math.max(0,Math.min(100,Math.round(v)));q(k).textContent=v+'%';q(k+'b').style.width=v+'%'}function setState(s,msg){if(s!==lastState){q('log').innerHTML='<div>'+new Date().toLocaleTimeString()+' · '+s+(msg?' · '+msg:'')+'</div>'+q('log').innerHTML;lastState=s}q('state').textContent=s}function monitor(){try{const d=f.contentDocument;if(!d)return requestAnimationFrame(monitor);const tx=id=>(d.getElementById(id)?.textContent||'');const tr=tx('trk'),de=tx('dec'),lo=tx('loc'),ge=tx('geo'),id=tx('id');const m=id.match(/VT-(\d{6})/),exact=/36\/36|ID válido/.test(de),tracking=/SEGUIMIENTO 4\/4|MICROSEGUIMIENTO/.test(tr),recover=/RECAPTUR/.test(tr+' '+ge),candidate=/localizado/.test(lo);if(exact&&m){authId=m[0];lastAuth=Date.now();q('aid').textContent='ID autenticada: '+authId;setState('AUTHENTICATED','nueva evidencia óptica 36/36');pct('g',100);pct('i',100);pct('t',100);q('rule').textContent='Geometría promovida: identidad validada por evidencia óptica.'}else if(recover&&authId){setState('REVALIDATION','barrera V activa');pct('g',candidate?70:30);pct('i',Math.max(15,92-(Date.now()-lastAuth)/90));pct('t',Math.max(10,82-(Date.now()-lastAuth)/130));q('rule').textContent='La geometría candidata NO hereda autenticidad. Sólo el mismo ID revalidado puede actualizar el ancla.'}else if(tracking&&authId){setState('TRACKING','G/T separados de I');const a=Date.now()-lastAuth;pct('g',95);pct('i',Math.max(45,100-a/170));pct('t',Math.max(55,100-a/240));q('rule').textContent='Tracking geométrico activo; la identidad conserva autoridad separada.'}else if(candidate&&!authId){setState('CANDIDATE','geometría sin identidad autenticada');pct('g',78);pct('i',15);pct('t',25);q('rule').textContent='Candidato localizado: todavía no autoriza una acción dependiente de identidad.'}else if(authId){setState('SUSPENDED','sin evidencia suficiente');pct('g',15);pct('i',Math.max(5,65-(Date.now()-lastAuth)/120));pct('t',10);q('rule').textContent='Sesión '+authId+' suspendida: proximidad o continuidad visual no restauran autenticidad.'}else{setState('SEARCH');pct('g',0);pct('i',0);pct('t',0);q('rule').textContent='Buscando un candidato VT.'}}catch(e){}requestAnimationFrame(monitor)}f.onload=()=>requestAnimationFrame(monitor);</script></body></html>
