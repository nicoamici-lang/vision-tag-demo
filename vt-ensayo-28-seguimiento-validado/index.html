<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VT-28 Seguimiento validado</title></head><body style="margin:0;background:#07130f;color:white"><p style="font-family:Arial;padding:20px">Cargando VT-28…</p><script>
(async()=>{
 const r=await fetch('../vt-ensayo-26-ancla-micro/index.html?vt28=2',{cache:'no-store'}); if(!r.ok)throw Error('No se pudo cargar la base VT-26'); let h=await r.text();
 h=h.replaceAll('VT-26 Ancla exacta','VT-28 Seguimiento validado').replaceAll('VISIÓN TAG · ENSAYO VT-26','VISIÓN TAG · ENSAYO VT-28');
 h=h.replace('Ancla exacta 0/36 + microseguimiento local de las cuatro esquinas. La búsqueda global se usa para adquirir o recuperar; después del primer 0/36 se prioriza la geometría autenticada. Sólo 0/36 suma; 10/10 valida.','Seguimiento validado: después del primer 0/36, la geometría autenticada queda protegida. El flujo óptico sólo propone movimiento cuando conserva 4/4 esquinas; la propuesta se limita y se verifica localmente. Únicamente otro 0/36 actualiza el ancla. Sólo 0/36 suma; 10/10 valida.');
 const oldOpt=`function optical(gray){if(!ofPrev||!ofPts)return null;let nxt=new cv.Mat(),st=new cv.Mat(),er=new cv.Mat();try{cv.calcOpticalFlowPyrLK(ofPrev,gray,ofPts,nxt,st,er,new cv.Size(27,27),4,new cv.TermCriteria(cv.TermCriteria_EPS|cv.TermCriteria_COUNT,25,.02),0,.001);let q=[],good=0;for(let i=0;i<4;i++){let ok=st.ucharPtr(i,0)[0]===1,e=er.floatPtr(i,0)[0];if(ok&&Number.isFinite(e)&&e<45)good++;q.push({x:nxt.floatPtr(i,0)[0],y:nxt.floatPtr(i,0)[1]})}ofGood=good;if(good===4){ofPrev.delete();ofPrev=gray.clone();ofPts.delete();ofPts=nxt.clone();return canonical(q)}return null}finally{nxt.delete();st.delete();er.delete()}}`;
 const newOpt=`function optical(gray){if(!ofPrev||!ofPts)return null;let nxt=new cv.Mat(),st=new cv.Mat(),er=new cv.Mat();try{cv.calcOpticalFlowPyrLK(ofPrev,gray,ofPts,nxt,st,er,new cv.Size(27,27),4,new cv.TermCriteria(cv.TermCriteria_EPS|cv.TermCriteria_COUNT,25,.02),0,.001);let q=[],good=0;for(let i=0;i<4;i++){let ok=st.ucharPtr(i,0)[0]===1,e=er.floatPtr(i,0)[0];if(ok&&Number.isFinite(e)&&e<45)good++;q.push({x:nxt.floatPtr(i,0)[0],y:nxt.floatPtr(i,0)[1]})}ofGood=good;if(good!==4)return null;return canonical(q)}finally{nxt.delete();st.delete();er.delete()}}`;
 if(!h.includes(oldOpt))throw Error('Base óptica VT-26 incompatible'); h=h.replace(oldOpt,newOpt);
 const marker='function micro(p){'; if(!h.includes(marker))throw Error('No se encontró micro()');
 const extra=`function vt28motion(pred,base){if(!pred||!base||ofGood!==4)return null;let cb=center(base),cp=center(pred),dx=cp.x-cb.x,dy=cp.y-cb.y;let per=0,pp=0;for(let i=0;i<4;i++){let j=(i+1)%4;per+=Math.hypot(base[i].x-base[j].x,base[i].y-base[j].y);pp+=Math.hypot(pred[i].x-pred[j].x,pred[i].y-pred[j].y)}let lim=Math.max(2,Math.min(10,per*.03)),m=Math.hypot(dx,dy);if(m>lim){dx*=lim/m;dy*=lim/m}let sc=per?pp/per:1;sc=Math.max(.988,Math.min(1.012,sc));return base.map(z=>({x:cb.x+dx+(z.x-cb.x)*sc,y:cb.y+dy+(z.y-cb.y)*sc}))}\nfunction vt28local(base,pred){let out=[{p:base.map(z=>({...z})),label:'ANCLA AUTENTICADA'}];if(pred)out.push({p:pred,label:'MOVIMIENTO LIMITADO'});for(const root of pred?[pred,base]:[base]){for(const u of[.35,.7,1.05])for(const d of[[-u,0],[u,0],[0,-u],[0,u],[-u,-u],[u,-u],[u,u],[-u,u]])out.push({p:root.map(z=>({x:z.x+d[0],y:z.y+d[1]})),label:'LOCAL XY '+u.toFixed(2)});for(const s of[.994,.997,1.003,1.006])out.push({p:hyp(root,s),label:'LOCAL ESC '+s.toFixed(3)})}return out}\n`;
 h=h.replace(marker,extra+marker);
 const oldSearch="pred=optical(gr)||anchor;tries.push(...micro(pred));mode='MICRO ANCLA'";
 const newSearch="pred=optical(gr);let mv=vt28motion(pred,anchor);tries.push(...vt28local(anchor,mv));mode=mv?'LOCAL VALIDADO · LK 4/4':'ANCLA FIJA · LK '+ofGood+'/4'";
 if(!h.includes(oldSearch))throw Error('No se encontró búsqueda VT-26'); h=h.replace(oldSearch,newSearch);
 h=h.replace("S('trk',anchor?'✓ 5. MICROSEGUIMIENTO · ID '+anchorId:'5. Ancla exacta: esperando 0/36',anchor?'ok':'wait');","S('trk',anchor?(ofGood===4?'✓ 5. ANCLA PROTEGIDA · LK 4/4 · ID '+anchorId:'✓ 5. ANCLA FIJA · LK '+ofGood+'/4 · ID '+anchorId):'5. Ancla exacta: esperando 0/36',anchor?'ok':'wait');");
 document.open();document.write(h);document.close();
})().catch(e=>{document.body.innerHTML='<pre style="white-space:pre-wrap;color:white;background:#07130f;padding:20px;font:16px Arial">VT-28 ERROR\n'+e.message+'</pre>'});
</script></body></html>
