<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VT-16 Ancla móvil</title><body style="margin:0;background:#07130f;color:white;font-family:Arial"><div id="boot" style="max-width:820px;margin:auto;padding:24px"><h1>VISIÓN TAG · ENSAYO VT-16</h1><p>Preparando lector directo + ancla móvil…</p></div><script>
(async()=>{try{
let h=await (await fetch('../vt-ensayo-13-consenso-temporal/index.html?vt16base=2',{cache:'no-store'})).text();
h=h.replaceAll('VT-13 Consenso temporal','VT-16 Ancla móvil').replaceAll('VISIÓN TAG · ENSAYO VT-13','VISIÓN TAG · ENSAYO VT-16').replace('Versión autónoma. Lector VT-10 estable + seguimiento geométrico. Sólo lecturas exactas 36/36 del mismo ID acumulan validación; no carga VT-12 ni VT-11 dinámicamente.','Lector directo con ancla móvil. Un 0/36 fija una referencia geométrica; el seguimiento desplaza esa referencia sin deformarla. Sólo 0/36 suma. Persistencia 6.5 s y 10/10 valida.');
h=h.replace("const $=x=>document.getElementById(x);let stream,running=false,busy=false,track=null,trackAge=0,exactId=null,hits=[],validatedVT=null;","const $=x=>document.getElementById(x);let stream,running=false,busy=false,track=null,trackAge=0,exactId=null,hits=[],validatedVT=null,validationComplete=false,anchor=null,anchorId=null,anchorAge=0,anchorRef=null,anchorMotion=0;");
h=h.replace("track=null;hits=[];exactId=null;validatedVT=null;","track=null;hits=[];exactId=null;validatedVT=null;validationComplete=false;anchor=null;anchorId=null;anchorAge=0;anchorRef=null;anchorMotion=0;");
h=h.replace("function score(src,p,scale,label){let pp=hyp(p,scale),o=warp(src,pp),d=decode(sample(o));return{p:pp,o,d,scale,label,rank:d.dist*100}}","function score(src,p,scale,label){let pp=hyp(p,scale),o=warp(src,pp),d=decode(sample(o));return{p:pp,o,d,scale,label,rank:d.dist*100}}function ashift(p,dx,dy){return p.map(q=>({x:q.x+dx,y:q.y+dy}))}function acenter(p){return{x:p.reduce((a,q)=>a+q.x,0)/4,y:p.reduce((a,q)=>a+q.y,0)/4}}function asize(p){let e=(a,b)=>Math.hypot(p[a].x-p[b].x,p[a].y-p[b].y);return(e(0,1)+e(1,2)+e(2,3)+e(3,0))/4}function moveAnchor(){if(!anchor||!track)return;let c=acenter(track);if(!anchorRef){anchorRef=c;return}let dx=c.x-anchorRef.x,dy=c.y-anchorRef.y,mag=Math.hypot(dx,dy),lim=Math.max(2,asize(anchor)*.10);if(mag<=lim){anchor=ashift(anchor,dx,dy);anchorMotion=mag}else anchorMotion=0;anchorRef=c}");
h=h.replace("function addHit(id){if(exactId!==id){exactId=id;hits=[]}hits.push(Date.now());let cut=Date.now()-2600;hits=hits.filter(t=>t>=cut);return Math.min(10,hits.length)}","function addHit(id){if(validationComplete)return 10;let now=Date.now();if(exactId!==null&&exactId!==id){hits=[];anchor=null;anchorId=null;anchorAge=0;anchorRef=null}exactId=id;hits.push(now);hits=hits.filter(t=>t>=now-6500);return Math.min(10,hits.length)}");
h=h.replace("let cs=candidates(th,w,h),tested=0,tries=[];if(track&&trackAge<12)","let cs=candidates(th,w,h),tested=0,tries=[];moveAnchor();if(anchor&&anchorAge<45){let u=Math.max(1,Math.min(3,asize(anchor)*.018));tries.push({p:anchor,scale:1,label:'ANCLA MÓVIL'});for(const d of[-u,u]){tries.push({p:ashift(anchor,d,0),scale:1,label:'ANCLA X'});tries.push({p:ashift(anchor,0,d),scale:1,label:'ANCLA Y'})}}if(track&&trackAge<12)");
h=h.replace("if(best&&best.d.dist===0&&best.label==='seguimiento')break","if(best&&best.d.dist===0&&(best.label==='seguimiento'||best.label.indexOf('ANCLA')===0))break");
h=h.replace("S('trk','✓ 5. Seguimiento '+(best.label==='seguimiento'?'ACTIVO':'adquirido'),'ok');","S('trk','✓ 5. '+(anchor?'ANCLA MÓVIL ACTIVA · ID '+anchorId:'Seguimiento '+(best.label==='seguimiento'?'ACTIVO':'adquirido')),'ok');");
h=h.replace("$('hyp').textContent='Hipótesis: '+best.label+' · escala '+best.scale.toFixed(2);","$('hyp').textContent='Hipótesis: '+best.label+' · escala '+best.scale.toFixed(2)+' · '+(anchor?'ANCLA '+anchorAge+'/45 · mov '+anchorMotion.toFixed(1)+'px':'sin ancla')+' · ventana 6.5 s';");
h=h.replace("if(best.d.dist===0&&best.d.id!==null){let count=addHit(best.d.id);","if(best.d.dist===0&&best.d.id!==null){if(anchorId===null||anchorId===best.d.id){anchor=best.p.map(q=>({...q}));anchorId=best.d.id;anchorAge=0;anchorRef=track?acenter(track):null;anchorMotion=0}else{anchor=null;anchorId=null;anchorAge=0;anchorRef=null}let count=addHit(best.d.id);");
h=h.replace("S('st',(count>=10?'✓ ':'')+'7. Consenso exacto: '+count+'/10',count>=10?'ok':'wait');if(count>=10){S('flow','✓ 8. VT VALIDADO · promociones habilitadas','ok');$('enter').classList.add('show')}","S('st',(count>=10?'✓ ':'')+'7. Persistencia exacta: '+count+'/10',count>=10?'ok':'wait');if(count>=10){validationComplete=true;S('st','✓ 7. Persistencia exacta: 10/10 · VALIDACIÓN COMPLETADA','ok');S('flow','✓ 8. VT VALIDADO · promociones habilitadas','ok');$('enter').classList.add('show')}");
h=h.replace("}else{S('dec','6. Mejor coincidencia · '+best.d.dist+'/36','wait');let live=hits.filter(t=>t>=Date.now()-2600).length;S('st','7. Consenso exacto: '+Math.min(10,live)+'/10','wait')}","}else{if(anchor&&++anchorAge>45){anchor=null;anchorId=null;anchorAge=0;anchorRef=null}S('dec','6. Mejor coincidencia · '+best.d.dist+'/36','wait');if(validationComplete)S('st','✓ 7. Persistencia exacta: 10/10 · VALIDACIÓN COMPLETADA','ok');else{let live=hits.filter(t=>t>=Date.now()-6500).length;S('st','7. Persistencia exacta: '+Math.min(10,live)+'/10','wait')}}");
h=h.replace("let live=hits.filter(t=>t>=Date.now()-2600).length;S('st','7. Consenso exacto: '+Math.min(10,live)+'/10');$('diag').textContent='Diagnóstico: sin lectura actual'","if(anchor&&++anchorAge>45){anchor=null;anchorId=null;anchorAge=0;anchorRef=null}if(validationComplete)S('st','✓ 7. Persistencia exacta: 10/10 · VALIDACIÓN COMPLETADA','ok');else{let live=hits.filter(t=>t>=Date.now()-6500).length;S('st','7. Persistencia exacta: '+Math.min(10,live)+'/10')}$('diag').textContent='Diagnóstico: sin lectura actual'");
document.open();document.write(h);document.close();
}catch(e){document.getElementById('boot').innerHTML='<h1>VT-16</h1><p>Error al preparar lector: '+e.message+'</p>'}
})();
</script></body>
