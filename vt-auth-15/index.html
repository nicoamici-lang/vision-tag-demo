<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VT-AUTH-15</title><style>html,body{margin:0;background:#07101f;color:#fff;font-family:Arial}#bar{position:sticky;top:0;z-index:99;background:#07101f;border-bottom:1px solid #2a3d60;padding:10px}.title{font-weight:900;font-size:20px}.sub{font-size:12px;color:#aab7d0;margin:3px 0 8px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.k{background:#111c31;border:1px solid #2a3d60;border-radius:9px;padding:7px;text-align:center}.k b{display:block;font-size:10px;color:#8da0c4}.k span{font-size:16px;font-weight:900}.cmp{margin-top:7px;background:#111c31;border:1px solid #2a3d60;border-radius:9px;padding:7px;font-size:11px}.cmp table{width:100%;border-collapse:collapse;text-align:center}.cmp th{color:#8da0c4}.cmp td{font-weight:800;padding:2px}.result{margin-top:7px;padding:8px;border-radius:9px;background:#5c4b1d;font-weight:900}.ok{background:#174d37}.bad{background:#69243b}iframe{width:100%;height:calc(100vh - 250px);border:0;display:block}@media(max-width:520px){.grid{grid-template-columns:1fr 1fr}iframe{height:calc(100vh - 315px)}}</style></head><body><div id="bar"><div class="title">VISION TAG · VT-AUTH-15</div><div class="sub">Huella óptica desde candidato localizado · no requiere 36/36 para diagnosticar</div><div class="grid"><div class="k"><b>CONTRASTE</b><span id="contrast">—</span></div><div class="k"><b>BORDES</b><span id="edge">—</span></div><div class="k"><b>SPREAD</b><span id="spread">—</span></div><div class="k"><b>Δ TOTAL</b><span id="delta">—</span></div></div><div class="cmp"><table><tr><th></th><th>REF</th><th>ACTUAL</th><th>Δ REL.</th></tr><tr><td>Contraste</td><td id="rc">—</td><td id="ac">—</td><td id="dc">—</td></tr><tr><td>Bordes</td><td id="re">—</td><td id="ae">—</td><td id="de">—</td></tr><tr><td>Spread</td><td id="rs">—</td><td id="as">—</td><td id="ds">—</td></tr></table></div><div id="result" class="result">DIAGNÓSTICO: esperando VT</div></div><iframe id="app" src="../vt-auth-13/"></iframe><script>const f=document.getElementById('app'),q=id=>document.getElementById(id);function n(v){return Number.isFinite(v)?v.toFixed(1):'—'}function clear(){['contrast','edge','spread','delta','rc','ac','dc','re','ae','de','rs','as','ds'].forEach(x=>q(x).textContent='—')}f.onload=()=>{try{const w=f.contentWindow,d=f.contentDocument;d.title='VT-AUTH-15';const h=d.querySelector('h1');if(h)h.textContent='VISION TAG · VT-AUTH-15';const p=h&&h.nextElementSibling;if(p)p.textContent='AUTH-15 · identidad y autenticidad separadas · huella óptica desde el primer candidato localizado.';const oldOpt=w.optical;w.optical=function(o){const m=oldOpt(o);q('contrast').textContent=n(m.contrast);q('edge').textContent=n(m.edge);q('spread').textContent=n(m.spread);q('ac').textContent=n(m.contrast);q('ae').textContent=n(m.edge);q('as').textContent=n(m.spread);const ref=w.originalFP;if(ref){q('rc').textContent=n(ref.contrast);q('re').textContent=n(ref.edge);q('rs').textContent=n(ref.spread);const dc=Math.abs(m.contrast-ref.contrast)/Math.max(8,ref.contrast),de=Math.abs(m.edge-ref.edge)/Math.max(12,ref.edge),ds=Math.abs(m.spread-ref.spread)/Math.max(5,ref.spread),score=dc*.35+de*.45+ds*.20;q('dc').textContent=dc.toFixed(3);q('de').textContent=de.toFixed(3);q('ds').textContent=ds.toFixed(3);q('delta').textContent=score.toFixed(3);const r=q('result');if(score<.18){r.textContent='DIAGNÓSTICO TEMPRANO: HUELLA COMPATIBLE CON ORIGINAL';r.className='result ok'}else{r.textContent='DIAGNÓSTICO TEMPRANO: HUELLA DIFERENTE / POSIBLE COPIA';r.className='result bad'}}else{q('delta').textContent='REF';q('result').textContent='DIAGNÓSTICO: registrando ORIGINAL';q('result').className='result'}return m};const oldReset=d.getElementById('resetFP');if(oldReset)oldReset.addEventListener('click',()=>{clear();q('result').textContent='DIAGNÓSTICO: esperando registro ORIGINAL';q('result').className='result'});const box=[...d.querySelectorAll('.box')].find(x=>x.textContent.includes('AUTH-13 separa'));if(box){const ps=[...box.querySelectorAll('p')];const info=ps[ps.length-1];if(info)info.textContent='AUTH-15 compara la huella óptica desde que existe un candidato visual, sin esperar a que la identidad alcance 36/36. La tabla REF/ACTUAL permite observar qué rasgo separa el soporte registrado de una reproducción. Este diagnóstico es informativo; la certificación y el CVC conservan las reglas estrictas de AUTH-13.'}}catch(e){q('result').textContent='DIAGNÓSTICO: error al enlazar AUTH-13';q('result').className='result bad';console.error(e)}};</script></body></html>
