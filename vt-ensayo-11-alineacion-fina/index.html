<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VT-11 Alineación fina</title><body style="margin:0;background:#07130f;color:white;font-family:Arial"><div id="boot" style="max-width:820px;margin:auto;padding:24px"><h1>VISIÓN TAG · ENSAYO VT-11</h1><p>Cargando VT-10 + alineación geométrica fina…</p></div><script>
(async()=>{try{
let h=await (await fetch('../vt-ensayo-10-seguimiento/index.html?vt11=2',{cache:'no-store'})).text();
h=h.replaceAll('VT-10 Seguimiento','VT-11 Alineación fina').replaceAll('VISIÓN TAG · ENSAYO VT-10','VISIÓN TAG · ENSAYO VT-11').replace('VT-09 conservado + seguimiento temporal. Mantiene la mejor geometría entre fotogramas y acumula únicamente lecturas exactas 36/36 del mismo ID.','VT-10 conservado + alineación fina. Sobre el cuadrilátero localizado busca pequeños ajustes X/Y y de sus cuatro bordes antes de muestrear los 36 módulos. Sólo 0/36 autentica.');
const patch=`
function vt11shift(p,dx,dy){return p.map(q=>({x:q.x+dx,y:q.y+dy}))}
function vt11edge(p,side,d){let q=p.map(x=>({x:x.x,y:x.y}));if(side==='L'){q[0].x+=d;q[3].x+=d}if(side==='R'){q[1].x+=d;q[2].x+=d}if(side==='T'){q[0].y+=d;q[1].y+=d}if(side==='B'){q[2].y+=d;q[3].y+=d}return q}
function vt11size(p){let e=(a,b)=>Math.hypot(p[a].x-p[b].x,p[a].y-p[b].y);return(e(0,1)+e(1,2)+e(2,3)+e(3,0))/4}
function score(src,p,scale,label){let base=hyp(p,scale),sets=[{p:base,n:'base'}];if(label==='seguimiento'){let u=Math.max(1,Math.min(5,vt11size(base)*.035));for(const dx of[-u,u])sets.push({p:vt11shift(base,dx,0),n:'X'+(dx>0?'+':'-')});for(const dy of[-u,u])sets.push({p:vt11shift(base,0,dy),n:'Y'+(dy>0?'+':'-')});for(const side of['L','R','T','B'])for(const d of[-u,u])sets.push({p:vt11edge(base,side,d),n:side+(d>0?'+':'-')})}let best=null;for(const s of sets){let o=warp(src,s.p),d=decode(sample(o)),z={p:s.p,o,d,scale,label:label+' · '+s.n,rank:d.dist*100};if(!best||z.rank<best.rank){if(best)best.o.delete();best=z}else o.delete();if(best.d.dist===0)break}return best}
`;
const marker='function addHit(id)';
const pos=h.indexOf(marker);
if(pos<0)throw new Error('no se encontró punto de inserción VT-10');
h=h.slice(0,pos)+patch+h.slice(pos);
document.open();document.write(h);document.close();
}catch(e){document.getElementById('boot').innerHTML='<h1>VT-11</h1><p>Error al cargar base VT-10: '+e.message+'</p>'}
})();
</script></body>
