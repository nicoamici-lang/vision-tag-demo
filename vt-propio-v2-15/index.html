<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VT V2.15</title><style>body{font-family:Arial;background:#07130f;color:white;padding:16px}main{max-width:820px;margin:auto}.box{background:#10231c;border:1px solid #315445;border-radius:14px;padding:14px;margin:12px 0}.ok{background:#234d38}.wait{background:#5c4b1d}.bad{background:#6a2340}.s{padding:10px;border-radius:9px;margin:7px 0}button{width:100%;padding:14px;border:0;border-radius:10px;font-weight:800;font-size:17px;background:#b8ff43}video,canvas{width:100%;border-radius:12px;background:#000}code{word-break:break-all}</style><main><h1>VT PROPIO V2.15 · Decodificación real</h1><div class="box"><div id="cam" class="s wait">1. Cámara: esperando</div><div id="cvst" class="s wait">2. OpenCV: cargando</div><div id="loc" class="s wait">3. VT: buscando</div><div id="dec" class="s wait">4. ID: esperando</div><div id="st" class="s wait">5. Estabilidad: 0/10</div></div><div class="box"><button id="go">ABRIR CÁMARA TRASERA</button></div><div class="box"><video id="v" playsinline muted autoplay></video><canvas id="live" width="640" height="480"></canvas></div><div class="box"><h2>VT rectificado + 36 puntos</h2><canvas id="rect" width="480" height="480"></canvas><p id="id">VT: —</p><p id="chk">Validación: —</p><code id="bits">Bits: —</code></div></main><script src="https://docs.opencv.org/4.x/opencv.js"></script><script src="../vt-propio-v2-14/validator15.js"></script><script>
const $=x=>document.getElementById(x);let stream,running=false,busy=false,last=null,n=0;const g=document.createElement('canvas'),gx=g.getContext('2d',{willReadFrequently:true});function S(i,t,c='wait'){let e=$(i);e.textContent=t;e.className='s '+c}let q=setInterval(()=>{if(window.cv&&cv.Mat){clearInterval(q);S('cvst','✓ 2. OpenCV listo','ok')}},200);$('go').onclick=async()=>{try{if(stream)stream.getTracks().forEach(t=>t.stop());stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'},audio:false});let v=$('v');v.srcObject=stream;await new Promise(r=>setTimeout(r,400));try{await v.play()}catch(e){}for(let i=0;i<50&&!v.videoWidth;i++)await new Promise(r=>setTimeout(r,100));if(!v.videoWidth)throw Error('sin imagen');S('cam','✓ 1. CÁMARA ACTIVA · '+v.videoWidth+'×'+v.videoHeight,'ok');running=true;loop()}catch(e){S('cam','✕ 1. Cámara: '+e.message,'bad')}};
function cand(bin,w,h){let cs=new cv.MatVector(),hi=new cv.Mat(),best=null,score=-1;cv.findContours(bin,cs,hi,cv.RETR_EXTERNAL,cv.CHAIN_APPROX_SIMPLE);for(let i=0;i<cs.size();i++){let c=cs.get(i),a=cv.contourArea(c),r=cv.boundingRect(c);c.delete();if(a<700)continue;let box=r.width*r.height,f=box/(w*h),as=Math.min(r.width,r.height)/Math.max(r.width,r.height);if(f<.006||f>.25||as<.7)continue;let fill=a/box,s=as*2.5+Math.min(fill,.7)+Math.min(f,.12)*4;if(s>score){score=s;best=r}}cs.delete();hi.delete();return best}function square(r,w,h){let s=Math.max(r.width,r.height)*1.08,cx=r.x+r.width/2,cy=r.y+r.height/2;s=Math.min(s,w,h);return{x:Math.max(0,Math.min(w-s,cx-s/2)),y:Math.max(0,Math.min(h-s,cy-s/2)),s}}
function warp(src,z){let a=cv.matFromArray(4,1,cv.CV_32FC2,[z.x,z.y,z.x+z.s,z.y,z.x+z.s,z.y+z.s,z.x,z.y+z.s]),b=cv.matFromArray(4,1,cv.CV_32FC2,[0,0,479,0,479,479,0,479]),M=cv.getPerspectiveTransform(a,b),o=new cv.Mat();cv.warpPerspective(src,o,M,new cv.Size(480,480));a.delete();b.delete();M.delete();return o}function sample(o){let gr=new cv.Mat(),bi=new cv.Mat(),ov=o.clone();cv.cvtColor(o,gr,cv.COLOR_RGBA2GRAY);cv.threshold(gr,bi,0,255,cv.THRESH_BINARY+cv.THRESH_OTSU);let bits=[];for(let r=3;r<9;r++)for(let c=3;c<9;c++){let x=Math.round((c+.5)*40),y=Math.round((r+.5)*40),sum=0,k=0;for(let yy=y-6;yy<=y+6;yy++)for(let xx=x-6;xx<=x+6;xx++){sum+=bi.ucharPtr(yy,xx)[0];k++}let bit=sum/k<128?1:0;bits.push(bit);cv.circle(ov,new cv.Point(x,y),12,bit?new cv.Scalar(255,70,90,255):new cv.Scalar(50,255,120,255),2)}gr.delete();bi.delete();return{bits,ov}}
function loop(){if(!running)return;requestAnimationFrame(loop);if(busy||!window.cv||!$('v').videoWidth)return;busy=true;let src,gr,th,an,o,ov;try{let v=$('v'),sc=Math.min(1,640/v.videoWidth),w=Math.round(v.videoWidth*sc),h=Math.round(v.videoHeight*sc);g.width=w;g.height=h;gx.drawImage(v,0,0,w,h);src=cv.matFromImageData(gx.getImageData(0,0,w,h));gr=new cv.Mat();th=new cv.Mat();cv.cvtColor(src,gr,cv.COLOR_RGBA2GRAY);cv.threshold(gr,th,0,255,cv.THRESH_BINARY_INV+cv.THRESH_OTSU);let c=cand(th,w,h);an=src.clone();if(c){let z=square(c,w,h);cv.rectangle(an,new cv.Point(z.x,z.y),new cv.Point(z.x+z.s,z.y+z.s),new cv.Scalar(0,255,0,255),3);o=warp(src,z);let s=sample(o);ov=s.ov;cv.imshow('rect',ov);let str=s.bits.join(''),d=VT15.decode(str);$('bits').textContent='Bits: '+str;S('loc','✓ 3. VT localizado y rectificado','ok');if(d.dist===0){if(last===d.id)n=Math.min(10,n+1);else{last=d.id;n=1}$('id').textContent='VT: VT-'+String(d.id).padStart(6,'0');$('chk').textContent='Validación: 36/36 · ID + CRC + redundancia';S('dec','✓ 4. ID válido · VT-'+String(d.id).padStart(6,'0'),'ok');S('st',(n===10?'✓ ':'')+'5. Estabilidad: '+n+'/10',n===10?'ok':'wait')}else{last=null;n=0;$('id').textContent='VT: —';$('chk').textContent='Más cercano VT-'+String(d.id).padStart(6,'0')+' · distancia '+d.dist+'/36';S('dec','4. Sin coincidencia exacta','wait');S('st','5. Estabilidad: 0/10','wait')}}cv.imshow('live',an)}catch(e){S('dec','ERROR: '+e.message,'bad')}finally{if(ov)ov.delete();if(o)o.delete();if(an)an.delete();if(src)src.delete();if(gr)gr.delete();if(th)th.delete();busy=false}}
</script>
