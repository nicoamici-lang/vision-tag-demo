<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VT-24 Contorno exterior bloqueado</title><style>body{font-family:Arial;background:#07130f;color:#fff;padding:24px;text-align:center}h1{margin-top:18vh}p{font-size:18px}</style><h1>VISIÓN TAG · ENSAYO VT-24</h1><p id="m">Cargando VT-24 sobre el núcleo validado de VT-22…</p><script>
(async()=>{try{
let h=await fetch('../vt-ensayo-22-distancia-movimiento/index.html?vt24=1',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('BASE '+r.status);return r.text()});
h=h.replaceAll('VT-22 Distancia + movimiento','VT-24 Contorno exterior bloqueado').replaceAll('VISIÓN TAG · ENSAYO VT-22','VISIÓN TAG · ENSAYO VT-24');
h=h.replace('Prueba real de distancia, inclinación, movimiento y vidrio/reflejos. Conserva flujo óptico LK de cuatro esquinas. Sólo una lectura exacta 0/36 suma; 10/10 valida.','Bloqueo del contorno exterior completo desde el primer 0/36. LK sólo predice la zona; se rechazan fragmentos internos incompatibles con el tamaño y geometría del último VT exacto. Sólo 0/36 suma; 10/10 valida.');
// VT-24: memoria geométrica del perímetro completo adquirido en un frame exacto.
h=h.replace("let stream,running=false,busy=false,track=null,anchor=null,anchorId=null,anchorAge=0,hits=[],exactId=null,validatedVT=null,done=false,ofPrev=null,ofPts=null,ofGood=0;","let stream,running=false,busy=false,track=null,anchor=null,anchorId=null,anchorAge=0,hits=[],exactId=null,validatedVT=null,done=false,ofPrev=null,ofPts=null,ofGood=0,outerRef=null;");
h=h.replace("function center(p){",`function geom24(p){let c=center(p),ds=[0,1,2,3].map(i=>Math.hypot(p[i].x-p[(i+1)%4].x,p[i].y-p[(i+1)%4].y)),w=(ds[0]+ds[2])/2,hh=(ds[1]+ds[3])/2,diag=Math.hypot(p[0].x-p[2].x,p[0].y-p[2].y);return{c,w,hh,diag,ratio:w/Math.max(1,hh)}}function compatible24(p,pred){if(!outerRef)return true;let g=geom24(p),r=outerRef,pg=pred?geom24(pred):r;let size=g.diag/Math.max(1,pg.diag),shape=g.ratio/Math.max(.01,r.ratio),dc=Math.hypot(g.c.x-pg.c.x,g.c.y-pg.c.y)/Math.max(1,pg.diag);return size>.72&&size<1.38&&shape>.72&&shape<1.38&&dc<.48}function center(p){`);
// Reemplazar la búsqueda LK: LK predice; sólo candidatos exteriores compatibles pueden reacoplarse. La predicción pura queda como gracia corta.
h=h.replace("let cs=candidates(th,w,h),tries=[],flowPred=null;if(anchor&&anchorAge<75){flowPred=optical(gr);if(flowPred){for(const s of[.988,.992,.996,1,1.004,1.008,1.012])tries.push({p:hyp(flowPred.p,s),label:'FLUJO LK '+s.toFixed(3)});for(const u of[.45,.9,1.35])for(const [dx,dy] of[[-u,0],[u,0],[0,-u],[0,u]])tries.push({p:flowPred.p.map(z=>({x:z.x+dx,y:z.y+dy})),label:'LK AJUSTE '+u.toFixed(2)})}else tries.push(...variants(anchor))}if(track)",`let cs=candidates(th,w,h),tries=[],flowPred=null;if(anchor&&anchorAge<75){flowPred=optical(gr);let pred=flowPred?flowPred.p:anchor;if(outerRef){let near=cs.filter(c=>compatible24(c.p,pred)).map(c=>{let g=geom24(c.p),pg=geom24(pred);return{c,q:Math.hypot(g.c.x-pg.c.x,g.c.y-pg.c.y)/Math.max(1,pg.diag)+Math.abs(g.diag/Math.max(1,pg.diag)-1)}}).sort((a,b)=>a.q-b.q).slice(0,10);for(const x of near)for(const s of[.94,.97,1,1.03,1.06])tries.push({p:hyp(x.c.p,s),label:'CONTORNO EXT '+s.toFixed(2)});if(flowPred&&anchorAge<12)for(const s of[.992,.996,1,1.004,1.008])tries.push({p:hyp(flowPred.p,s),label:'GRACIA LK '+s.toFixed(3)});if(!near.length&&anchorAge<8)tries.push(...variants(anchor).map(v=>({p:v.p,label:'GRACIA ANCLA'})))}else if(flowPred){for(const s of[.988,.996,1,1.004,1.012])tries.push({p:hyp(flowPred.p,s),label:'LK PRE-ANCLA '+s.toFixed(3)})}else tries.push(...variants(anchor))}if(track)`);
// Priorizar corte temprano sólo si el reacople exterior o la gracia producen 0/36 real.
h=h.replace("if(z.d.dist===0&&anchor&&(t.label.startsWith('FLUJO')||t.label.startsWith('LK ')||t.label.startsWith('SUBPIX')))break","if(z.d.dist===0&&anchor&&(t.label.startsWith('CONTORNO EXT')||t.label.startsWith('GRACIA')||t.label.startsWith('LK PRE')||t.label.startsWith('FLUJO')||t.label.startsWith('LK ')||t.label.startsWith('SUBPIX')))break");
// Cada 0/36 redefine el perímetro exterior de referencia; ningún frame aproximado lo deforma.
h=h.replace("anchor=best.p.map(z=>({...z}));anchorId=best.d.id;anchorAge=0;seedOF(gr,anchor);","anchor=best.p.map(z=>({...z}));anchorId=best.d.id;anchorAge=0;outerRef=geom24(anchor);seedOF(gr,anchor);");
// Si el ancla vence, también liberar el bloqueo exterior para permitir readquisición global limpia.
h=h.replace("if(anchorAge>75){anchor=null;anchorId=null;clearOF()}","if(anchorAge>75){anchor=null;anchorId=null;outerRef=null;clearOF()}");
// No presentar un ID aproximado como autenticado.
h=h.replace("$('id').textContent='VT: '+validatedVT;","$('id').textContent='VT AUTENTICADO: '+validatedVT;");
h=h.replace("S('dec','6. Mejor coincidencia · '+best.d.dist+'/36','wait');","$('id').textContent=anchorId!==null?'Último ID exacto: VT-'+String(anchorId).padStart(6,'0'):'VT: —';S('dec','6. Frame actual NO autenticado · '+best.d.dist+'/36','wait');");
// Diagnóstico VT-24.
h=h.replace("S('geo','✓ 4. '+tries.length+' hipótesis · DISTANCIA/MOVIMIENTO','ok');","S('geo','✓ 4. '+tries.length+' hipótesis · CONTORNO EXTERIOR','ok');");
h=h.replaceAll('FLUJO ÓPTICO ACTIVO','CONTORNO EXTERIOR BLOQUEADO').replaceAll('FLUJO ÓPTICO · RECUPERANDO','CONTORNO EXTERIOR · REACOPLANDO');
h=h.replace("$('hyp').textContent='Hipótesis: '+best.label+(anchor?' · ANCLA '+anchorAge+'/75':'')+(ofPts?' · LK '+ofGood+'/4':'');","$('hyp').textContent='Hipótesis: '+best.label+(anchor?' · ANCLA '+anchorAge+'/75':'')+(outerRef?' · PERÍMETRO BLOQUEADO':'')+(ofPts?' · LK '+ofGood+'/4':'');");
document.open();document.write(h);document.close();
}catch(e){document.getElementById('m').textContent='Error al cargar VT-24: '+e.message}}
)();
</script>
