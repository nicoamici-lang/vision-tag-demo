<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VT-AUTH-20</title><style>html,body{margin:0;background:#07130f;color:#fff;font-family:Arial}#top{position:sticky;top:0;z-index:90;background:#07130f;border-bottom:1px solid #315445;padding:10px}.title{font-size:20px;font-weight:900;color:#28d17e}.state{font-size:27px;font-weight:900;margin:4px 0}.ids{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin:6px 0}.idbox{background:#10231c;border-radius:9px;padding:8px}.idbox b{font-size:10px;color:#9eb5aa;display:block}.idbox span{font-size:18px;font-weight:900}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.m{background:#10231c;border-radius:9px;padding:7px;text-align:center}.m b{display:block;font-size:10px;color:#a9bdb4}.n{font-size:20px;font-weight:900}.bar{height:5px;background:#294238;border-radius:5px;overflow:hidden}.bar i{display:block;height:100%;background:#b8ff43}.gate,.switch{margin-top:7px;padding:9px;border-radius:9px;font-weight:900}.gate{background:#6a2340}.gate.ok{background:#234d38}.switch{display:none;background:#7b2434;border:2px solid #ff7389}.switch.show{display:block}.rule{font-size:12px;margin-top:6px;color:#c8d8d0}.log{font-size:10px;color:#92aa9f;max-height:34px;overflow:auto;margin-top:4px}iframe{width:100%;height:calc(100vh - 310px);border:0}</style></head><body><div id="top"><div class="title">VISION TAG · VT-AUTH-20</div><div id="state" class="state">SEARCH</div><div class="ids"><div class="idbox"><b>ID DE SESIÓN</b><span id="sid">—</span></div><div class="idbox"><b>ID CANDIDATA ACTUAL</b><span id="cid">—</span></div></div><div class="grid"><div class="m"><b>G · GEOMETRÍA</b><span id="g" class="n">0%</span><div class="bar"><i id="gb"></i></div></div><div class="m"><b>I · IDENTIDAD</b><span id="i" class="n">0%</span><div class="bar"><i id="ib"></i></div></div><div class="m"><b>T · TEMPORAL</b><span id="t" class="n">0%</span><div class="bar"><i id="tb"></i></div></div></div><div id="sw" class="switch">IDENTITY SWITCH DETECTED<br><span id="swtext"></span><br>HERENCIA DE AUTORIZACIÓN: BLOQUEADA</div><div id="gate" class="gate">AUTORIZACIÓN REVOCADA · PROMOCIONES BLOQUEADAS</div><div id="rule" class="rule">Una nueva ID nunca hereda la sesión anterior.</div><div id="log" class="log"></div></div><iframe id="app" src="../vt-ensayo-29-recaptura-ancla/?auth20=1"></iframe><script>const f=document.getElementById('app'),q=x=>document.getElementById(x);let sessionId=null,candidateId=null,lastAuth=0,lastState='',switchId=null;function pct(k,v){v=Math.max(0,Math.min(100,Math.round(v)));q(k).textContent=v+'%';q(k+'b').style.width=v+'%'}function st(s,msg){if(s!==lastState){q('log').innerHTML='<div>'+new Date().toLocaleTimeString()+' · '+s+(msg?' · '+msg:'')+'</div>'+q('log').innerHTML;lastState=s}q('state').textContent=s}function gate(on,d,why){q('gate').className='gate'+(on?' ok':'');q('gate').textContent=on?'AUTORIZACIÓN ACTIVA · PROMOCIONES HABILITADAS':'AUTORIZACIÓN REVOCADA · PROMOCIONES BLOQUEADAS';const e=d?.getElementById('enter');if(e){e.style.display=on?'block':'none';e.disabled=!on}const flow=d?.getElementById('flow');if(flow&&!on){flow.textContent='8. AUTORIZACIÓN REVOCADA · '+why;flow.className='s bad'}}function showSwitch(newId){switchId=newId;q('sw').className='switch show';q('swtext').textContent='Sesión: '+sessionId+' → candidato: '+newId;q('rule').textContent='Continuidad de identidad RECHAZADA. El candidato debe crear una sesión independiente.'}function monitor(){try{const d=f.contentDocument;if(!d)return requestAnimationFrame(monitor);const tx=id=>(d.getElementById(id)?.textContent||'');const tr=tx('trk'),de=tx('dec'),ps=tx('st'),lo=tx('loc'),ge=tx('geo'),raw=tx('id');let m=raw.match(/VT-(\d{6})/);candidateId=m?m[0]:null;q('cid').textContent=candidateId||'—';const exact=/36\/36|ID válido/.test(de),persistent=/10\/10/.test(ps),tracking=/SEGUIMIENTO 4\/4|MICROSEGUIMIENTO/.test(tr),recover=/RECAPTUR/.test(tr+' '+ge),candidate=/localizado/.test(lo);if(candidateId&&sessionId&&candidateId!==sessionId){showSwitch(candidateId);st('IDENTITY SWITCH','A→B detectado');pct('g',candidate?80:50);pct('i',0);pct('t',0);gate(false,d,'cambio de identidad');return requestAnimationFrame(monitor)}if(exact&&candidateId&&persistent){if(!sessionId){sessionId=candidateId;q('sid').textContent=sessionId;q('sw').className='switch';lastAuth=Date.now();st('AUTHENTICATED','nueva sesión '+sessionId);pct('g',100);pct('i',100);pct('t',100);gate(true,d,'')}else if(candidateId===sessionId){lastAuth=Date.now();st('AUTHENTICATED','misma ID 36/36 + 10/10');pct('g',100);pct('i',100);pct('t',100);gate(true,d,'')}}else if(recover&&sessionId){st('REVALIDATION','sesión '+sessionId);pct('g',candidate?70:30);pct('i',Math.max(15,90-(Date.now()-lastAuth)/90));pct('t',Math.max(10,80-(Date.now()-lastAuth)/130));gate(false,d,'revalidación')}else if(tracking&&sessionId){st('TRACKING');const a=Date.now()-lastAuth;pct('g',95);pct('i',Math.max(45,100-a/170));pct('t',Math.max(55,100-a/240));gate(false,d,'tracking sin revalidación')}else if(candidate&&!sessionId){st('CANDIDATE');pct('g',78);pct('i',15);pct('t',25);gate(false,d,'candidato no autenticado')}else if(sessionId){st('SUSPENDED');pct('g',15);pct('i',5);pct('t',10);gate(false,d,'sesión suspendida')}else{st('SEARCH');pct('g',0);pct('i',0);pct('t',0);gate(false,d,'buscando VT')}}catch(e){}requestAnimationFrame(monitor)}f.onload=()=>requestAnimationFrame(monitor);</script></body></html>
