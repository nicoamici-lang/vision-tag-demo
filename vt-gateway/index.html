<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VISIÓN TAG · Acceso</title><style>body{font-family:Arial;background:#07130f;color:#fff;margin:0;padding:18px}.w{max-width:680px;margin:auto}.tag{display:inline-block;background:#b8ff43;color:#07130f;padding:8px 12px;border-radius:30px;font-weight:900}.c{background:#10231c;border:1px solid #315445;border-radius:16px;padding:18px;margin:14px 0}.ok{background:#234d38;padding:14px;border-radius:12px}.bad{background:#6a2340;padding:14px;border-radius:12px}button{width:100%;padding:16px;border:0;border-radius:12px;background:#b8ff43;color:#07130f;font-size:18px;font-weight:900;margin-top:14px}.big{font-size:24px;font-weight:900}.muted{opacity:.8}</style></head><body><div class="w"><span class="tag">VISIÓN TAG · GATEWAY</span><h1>Identidad validada → plataforma</h1><div class="c"><div id="state"></div><div id="vt" class="big" style="margin-top:14px"></div><button id="go" style="display:none">ABRIR PROMOCIONES EXCLUSIVAS</button><button id="back">VOLVER AL LECTOR</button></div></div><script>const id=localStorage.getItem('vtValidatedId'),at=Number(localStorage.getItem('vtValidatedAt')||0),age=Date.now()-at,state=document.getElementById('state'),vt=document.getElementById('vt'),go=document.getElementById('go');if(id&&at&&age<15*60*1000){state.className='ok';state.textContent='✓ VT validado por el módulo óptico';vt.textContent=id;go.style.display='block';go.onclick=()=>location.href='../platform-v1/?vt='+encodeURIComponent(id)}else{state.className='bad';state.textContent='No hay un VT validado recientemente. Primero realizá la lectura óptica.';vt.textContent='VT: —'}document.getElementById('back').onclick=()=>location.href='../vt-reader-stable/';</script></body></html>
