<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VT-AUTH-17</title><style>html,body{margin:0;background:#07101f;color:#fff;font-family:Arial}#bar{position:sticky;top:0;z-index:99;background:#07101f;border-bottom:1px solid #2a3d60;padding:10px}.title{font-weight:900;font-size:20px}.sub{font-size:12px;color:#aab7d0;margin:3px 0 8px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.k,.cmp{background:#111c31;border:1px solid #2a3d60;border-radius:9px;padding:7px}.k{text-align:center}.k b{display:block;font-size:10px;color:#8da0c4}.k span{font-size:16px;font-weight:900}.cmp{margin-top:7px;font-size:11px}.cmp table{width:100%;border-collapse:collapse;text-align:center}.cmp th{color:#8da0c4}.cmp td{font-weight:800;padding:2px}.result{margin-top:7px;padding:8px;border-radius:9px;background:#5c4b1d;font-weight:900}.ok{background:#174d37}.bad{background:#69243b}.wait{background:#5c4b1d}iframe{width:100%;height:calc(100vh - 270px);border:0;display:block}@media(max-width:520px){.grid{grid-template-columns:1fr 1fr}iframe{height:calc(100vh - 335px)}}</style></head><body><div id="bar"><div class="title">VISION TAG · VT-AUTH-17</div><div class="sub">REF persistente real desde ORIGINAL guardado · comparación óptica en vivo independiente del 36/36</div><div class="grid"><div class="k"><b>CONTRASTE</b><span id="contrast">—</span></div><div class="k"><b>BORDES</b><span id="edge">—</span></div><div class="k"><b>SPREAD</b><span id="spread">—</span></div><div class="k"><b>Δ TOTAL</b><span id="delta">—</span></div></div><div class="cmp"><table><tr><th></th><th>REF</th><th>ACTUAL</th><th>Δ REL.</th></tr><tr><td>Contraste</td><td id="rc">—</td><td id="ac">—</td><td id="dc">—</td></tr><tr><td>Bordes</td><td id="re">—</td><td id="ae">—</td><td id="de">—</td></tr><tr><td>Spread</td><td id="rs">—</td><td id="as">—</td><td id="ds">—</td></tr></table></div><div id="result" class="result wait">DIAGNÓSTICO: esperando VT</div></div><iframe id="app" src="../vt-auth-13/?auth17=1"></iframe><script>const f=document.getElementById('app'),q=id=>document.getElementById(id);let last=null;function n(v){return Number.isFinite(v)?v.toFixed(1):'—'}function getRef(){try{return JSON.parse(localStorage.getItem('vtAuth13FP')||'null')}catch(e){return null}}function clearPanel(){['contrast','edge','spread','delta','rc','ac','dc','re','ae','de','rs','as','ds'].forEach(x=>q(x).textContent='—')}function paint(m){last=m;const ref=getRef();q('contrast').textContent=n(m.contrast);q('edge').textContent=n(m.edge);q('spread').textContent=n(m.spread);q('ac').textContent=n(m.contrast);q('ae').textContent=n(m.edge);q('as').textContent=n(m.spread);if(!ref){q('rc').textContent=q('re').textContent=q('rs').textContent='—';q('dc').textContent=q('de').textContent=q('ds').textContent='—';q('delta').textContent='REF';q('result').textContent='DIAGNÓSTICO: registrando ORIGINAL';q('result').className='result wait';return}q('rc').textContent=n(ref.contrast);q('re').textContent=n(ref.edge);q('rs').textContent=n(ref.spread);const dc=Math.abs(m.contrast-ref.contrast)/Math.max(8,ref.contrast),de=Math.abs(m.edge-ref.edge)/Math.max(12,ref.edge),ds=Math.abs(m.spread-ref.spread)/Math.max(5,ref.spread),score=dc*.35+de*.45+ds*.20;q('dc').textContent=dc.toFixed(3);q('de').textContent=de.toFixed(3);q('ds').textContent=ds.toFixed(3);q('delta').textContent=score.toFixed(3);if(score<.18){q('result').textContent='HUELLA COMPATIBLE CON ORIGINAL · diagnóstico temprano';q('result').className='result ok'}else{q('result').textContent='HUELLA DIFERENTE / POSIBLE COPIA · diagnóstico temprano';q('result').className='result bad'}}f.onload=()=>{try{const w=f.contentWindow,d=f.contentDocument;d.title='VT-AUTH-17';const h=d.querySelector('h1');if(h)h.textContent='VISION TAG · VT-AUTH-17';const p=d.querySelector('h1+p');if(p)p.textContent='Identidad 36/36 + autenticidad óptica independiente por sesión · ORIGINAL vs COPIA · diagnóstico REF persistente.';const old=w.optical;if(typeof old!=='function')throw new Error('optical no disponible');w.optical=function(o){const m=old(o);paint(m);return m};setInterval(()=>{try{if(last)paint(last)}catch(e){}},300);const reset=d.getElementById('resetFP');if(reset)reset.addEventListener('click',()=>{last=null;clearPanel();q('result').textContent='DIAGNÓSTICO: esperando nuevo ORIGINAL';q('result').className='result wait'})}catch(e){q('result').textContent='ERROR AUTH-17: '+e.message;q('result').className='result bad'}};</script></body></html>
