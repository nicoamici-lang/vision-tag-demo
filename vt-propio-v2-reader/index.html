<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VISIÓN TAG · VT PROPIO V2</title><style>body{font-family:Arial;background:#07130f;color:#fff;margin:0;padding:16px}.w{max-width:900px;margin:auto}.tag{display:inline-block;background:#b8ff43;color:#07130f;padding:7px 11px;border-radius:99px;font-weight:800}.c{background:#10231c;border:1px solid #315445;border-radius:16px;padding:14px;margin:12px 0}.s{padding:10px;border-radius:9px;margin:7px 0}.ok{background:#234d38}.wait{background:#5c4b1d}.bad{background:#6a2340}button{width:100%;padding:14px;border:0;border-radius:10px;font-size:17px;font-weight:800;background:#b8ff43}video,canvas{width:100%;border-radius:12px}.big{font-size:20px;font-weight:800}</style></head><body><div class="w"><span class="tag">VT PROPIO V2 · ENSAYO VT-04</span><h1>Lector experimental</h1><p>Objetivo: localizar la zona óptica 12×12, corregir perspectiva y decodificar ID + CRC. No usa AprilTag.</p><div class="c"><div id="cam" class="s wait">1. Cámara: esperando</div><div id="loc" class="s wait">2. Localización: esperando</div><div id="dec" class="s wait">3. Decodificación: esperando</div><div id="err" class="s wait">Sin errores.</div></div><div class="c"><button id="start">ACTIVAR CÁMARA</button></div><div class="c"><video id="v" playsinline autoplay muted></video><canvas id="o" width="640" height="480"></canvas></div><div class="c"><div id="id" class="big">VT: —</div><div id="st" class="big">Estabilidad: 0/10</div></div></div><script src="https://docs.opencv.org/4.x/opencv.js"></script><script>
const $=x=>document.getElementById(x);let stream=null,running=false,last=null,streak=0,cvReady=false;function S(id,t,cl='wait'){$(id).className='s '+cl;$(id).textContent=t}function crc8(bits){let v=0;for(let i=0;i<bits.length;i+=8){let byte=0,n=Math.min(8,bits.length-i);for(let j=0;j<n;j++)byte=(byte<<1)|bits[i+j];byte<<=(8-n);v^=byte;for(let k=0;k<8;k++)v=v&128?((v<<1)^7)&255:(v<<1)&255}return Array.from({length:8},(_,i)=>(v>>(7-i))&1)}function eq(a,b){return a.length===b.length&&a.every((v,i)=>v===b[i])}function bitsToInt(b){return b.reduce((n,x)=>(n<<1)|x,0)}
function ready(){if(window.cv&&cv.Mat){cvReady=true}};let rt=setInterval(()=>{try{ready();if(cvReady)clearInterval(rt)}catch(e){}},250);
$('start').onclick=async()=>{try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}},audio:false});$('v').srcObject=stream;await new Promise(r=>$('v').onloadedmetadata=r);S('cam','✓ 1. CÁMARA ACTIVA','ok');running=true;loop()}catch(e){S('err','ERROR cámara: '+e.message,'bad')}};
function order(pts){pts.sort((a,b)=>a.y-b.y);let top=pts.slice(0,2).sort((a,b)=>a.x-b.x),bot=pts.slice(2).sort((a,b)=>a.x-b.x);return [top[0],top[1],bot[1],bot[0]]}
function decode(warp){let gray=new cv.Mat();cv.cvtColor(warp,gray,cv.COLOR_RGBA2GRAY);let bin=new cv.Mat();cv.threshold(gray,bin,0,255,cv.THRESH_BINARY+cv.THRESH_OTSU);let cell=bin.cols/12,bits=[];for(let r=3;r<9;r++)for(let c=3;c<9;c++){let x=Math.floor((c+.5)*cell),y=Math.floor((r+.5)*cell);bits.push(bin.ucharPtr(y,x)[0]<128?1:0)}let ib=bits.slice(0,20),cb=bits.slice(20,28),id=bitsToInt(ib);let good=eq(cb,crc8(ib));gray.delete();bin.delete();return good?id:null}
function loop(){if(!running)return;requestAnimationFrame(loop);if(!cvReady||!$('v').videoWidth)return;let cap=new cv.VideoCapture($('v')),src=new cv.Mat($('v').videoHeight,$('v').videoWidth,cv.CV_8UC4);cap.read(src);let scale=Math.min(1,640/src.cols),small=new cv.Mat();cv.resize(src,small,new cv.Size(Math.round(src.cols*scale),Math.round(src.rows*scale)));let gray=new cv.Mat(),thr=new cv.Mat();cv.cvtColor(small,gray,cv.COLOR_RGBA2GRAY);cv.threshold(gray,thr,0,255,cv.THRESH_BINARY_INV+cv.THRESH_OTSU);let contours=new cv.MatVector(),hier=new cv.Mat();cv.findContours(thr,contours,hier,cv.RETR_EXTERNAL,cv.CHAIN_APPROX_SIMPLE);let best=null,area=0;for(let i=0;i<contours.size();i++){let c=contours.get(i),a=cv.contourArea(c);if(a<1500){c.delete();continue}let peri=cv.arcLength(c,true),ap=new cv.Mat();cv.approxPolyDP(c,ap,.03*peri,true);if(ap.rows===4&&a>area){if(best)best.delete();best=ap.clone();area=a}ap.delete();c.delete()}if(best){let pts=[];for(let i=0;i<4;i++)pts.push({x:best.intPtr(i,0)[0],y:best.intPtr(i,0)[1]});pts=order(pts);let from=cv.matFromArray(4,1,cv.CV_32FC2,pts.flatMap(p=>[p.x,p.y])),to=cv.matFromArray(4,1,cv.CV_32FC2,[0,0,479,0,479,479,0,479]),M=cv.getPerspectiveTransform(from,to),warp=new cv.Mat();cv.warpPerspective(small,warp,M,new cv.Size(480,480));let n=decode(warp);S('loc','✓ 2. ZONA ÓPTICA LOCALIZADA','ok');if(n!==null&&n>=1&&n<=1048575){if(n===last)streak=Math.min(10,streak+1);else{last=n;streak=1}S('dec','✓ 3. CRC VÁLIDO · ID '+String(n).padStart(6,'0'),'ok');$('id').textContent='VT: VT-'+String(n).padStart(6,'0');$('st').textContent='Estabilidad: '+streak+'/10'}else{last=null;streak=0;S('dec','3. Patrón localizado, CRC aún no válido');$('id').textContent='VT: —';$('st').textContent='Estabilidad: 0/10'}warp.delete();M.delete();from.delete();to.delete();best.delete()}else{S('loc','2. Buscando zona óptica…');S('dec','3. Decodificación: esperando')}cv.imshow('o',small);src.delete();small.delete();gray.delete();thr.delete();contours.delete();hier.delete()}
</script></body></html>
