<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vision Tag · Beneficios Trelew</title><style>*{box-sizing:border-box}body{margin:0;background:#071008;color:white;font-family:Arial,sans-serif}.wrap{max-width:560px;margin:auto;padding:22px}.brand{font-size:32px;font-weight:900}.brand b{color:#91ff3c}.muted{color:#c0d1bf}.id{color:#a3ff79;font-weight:bold}.card{background:#122015;border:1px solid #79ff35;border-radius:18px;padding:22px;margin:22px 0}a.btn{display:block;text-align:center;background:#8bff3c;color:#081008;font-weight:900;padding:17px;border-radius:12px;text-decoration:none;margin-top:15px}.warning{font-size:12px;color:#c9d5c6}.tag{font-size:12px;color:#b0ff91}</style></head><body><main class="wrap"><div class="brand">VISION <b>TAG</b></div><p class="muted">BENEFICIOS EN TU CIUDAD · TRELEW</p><h1>Descubrí los beneficios</h1><p id="origin" class="id">Verificando marcador...</p><div id="offers">Cargando promociones...</div><p class="warning">Las promociones de demostración no son ofertas comerciales reales.</p><p id="state" class="tag"></p></main><script>const API='https://vision-tag-trelew-api.onrender.com';const q=new URLSearchParams(location.search),vt=q.get('vt');const match=typeof vt==='string'&&/^VT-\d{6}$/.test(vt)&&Number(vt.slice(3))>=1&&Number(vt.slice(3))<=36;const n=match?Number(vt.slice(3)):0;const o=document.getElementById('origin'),s=document.getElementById('state');o.textContent=match?vt+' · Colectivo '+(Math.floor((n-1)/6)+1)+' · Posición '+((n-1)%6+1):'Marcador no identificado';let session=sessionStorage.getItem('vt_qr_session');if(!session){session=crypto.randomUUID();sessionStorage.setItem('vt_qr_session',session)}async function send(type,offer){if(!match)return;try{const r=await fetch(API+'/api/events',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:crypto.randomUUID(),vt,type,offer:offer||'',session}),keepalive:true});if(!r.ok)throw Error('HTTP '+r.status);s.textContent='✓ Interacción registrada en el servidor'}catch(e){s.textContent='Sin confirmación del registro; podés continuar'}}async function init(){if(match)send('scan');try{const r=await fetch('./promociones.json?v=1',{cache:'no-store'});if(!r.ok)throw Error('No se pudo cargar el catálogo');const catalog=await r.json();const root=document.getElementById('offers');root.textContent='';const offers=catalog.offers.filter(x=>x.active);if(!offers.length){root.textContent='Próximamente habrá beneficios disponibles.';return}for(const offer of offers){const card=document.createElement('article');card.className='card';const name=document.createElement('h2');name.textContent=offer.name;card.append(name);const h=document.createElement('h3');h.textContent=offer.headline;card.append(h);const p=document.createElement('p');p.className='muted';p.textContent=offer.description;card.append(p);if(offer.demo){const d=document.createElement('p');d.className='warning';d.textContent='SOLO DEMOSTRACIÓN · No válida como promoción real';card.append(d)}if(offer.ageRestricted){const age=document.createElement('p');age.className='warning';age.textContent='Solo mayores de 18 años';card.append(age)}const a=document.createElement('a');a.className='btn';a.textContent=offer.demo?'PROBAR CUPÓN DE DEMOSTRACIÓN':'VER PROMOCIÓN';const u=new URL(offer.url,location.href);if(match)u.searchParams.set('vt',vt);a.href=u.href;a.addEventListener('click',()=>send('open',offer.id));card.append(a);root.append(card)}}catch(e){document.getElementById('offers').textContent='No pudimos cargar las promociones. Intentá actualizar la página.'}}init();</script></body></html>
