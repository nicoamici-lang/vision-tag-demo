<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VT-AUTH-14</title><style>html,body{margin:0;background:#07101f;color:#fff;font-family:Arial}#bar{position:sticky;top:0;z-index:99;background:#07101f;border-bottom:1px solid #2a3d60;padding:10px}.title{font-weight:900;font-size:20px}.sub{font-size:12px;color:#aab7d0;margin:3px 0 8px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.k{background:#111c31;border:1px solid #2a3d60;border-radius:9px;padding:7px;text-align:center}.k b{display:block;font-size:10px;color:#8da0c4}.k span{font-size:16px;font-weight:900}.result{margin-top:7px;padding:8px;border-radius:9px;background:#5c4b1d;font-weight:900}.ok{background:#174d37}.bad{background:#69243b}iframe{width:100%;height:calc(100vh - 180px);border:0;display:block}@media(max-width:520px){.grid{grid-template-columns:1fr 1fr}iframe{height:calc(100vh - 245px)}}</style></head><body><div id="bar"><div class="title">VISION TAG · VT-AUTH-14</div><div class="sub">Diagnóstico óptico en vivo · identidad y autenticidad separadas</div><div class="grid"><div class="k"><b>CONTRASTE</b><span id="contrast">—</span></div><div class="k"><b>BORDES</b><span id="edge">—</span></div><div class="k"><b>SPREAD</b><span id="spread">—</span></div><div class="k"><b>Δ TOTAL</b><span id="delta">—</span></div></div><div id="result" class="result">DIAGNÓSTICO: esperando VT</div></div><iframe id="app" src="../vt-auth-13/"></iframe><script>const f=document.getElementById('app'),q=id=>document.getElementById(id);f.onload=()=>{try{const w=f.contentWindow,d=f.contentDocument;d.title='VT-AUTH-14';const h=d.querySelector('h1');if(h)h.textContent='VISION TAG · VT-AUTH-14';const p=h&&h.nextElementSibling;if(p)p.textContent='AUTH-14 · identidad 36/36 + diagnóstico óptico en vivo · ORIGINAL vs COPIA.';let last=null;const oldOpt=w.optical;w.optical=function(o){const m=oldOpt(o);last=m;q('contrast').textContent=m.contrast.toFixed(1);q('edge').textContent=m.edge.toFixed(1);q('spread').textContent=m.spread.toFixed(1);if(w.originalFP){const dc=Math.abs(m.contrast-w.originalFP.contrast)/Math.max(8,w.originalFP.contrast),de=Math.abs(m.edge-w.originalFP.edge)/Math.max(12,w.originalFP.edge),ds=Math.abs(m.spread-w.originalFP.spread)/Math.max(5,w.originalFP.spread),score=dc*.35+de*.45+ds*.20;q('delta').textContent=score.toFixed(3);const r=q('result');if(score<.18){r.textContent='DIAGNÓSTICO: ORIGINAL / HUELLA COMPATIBLE';r.className='result ok'}else{r.textContent='DIAGNÓSTICO: COPIA / HUELLA NO COMPATIBLE';r.className='result bad'}}else{q('delta').textContent='REF';q('result').textContent='DIAGNÓSTICO: registrando ORIGINAL';q('result').className='result'}return m};const oldReset=d.getElementById('resetFP');if(oldReset)oldReset.addEventListener('click',()=>{['contrast','edge','spread','delta'].forEach(x=>q(x).textContent='—');q('result').textContent='DIAGNÓSTICO: esperando registro ORIGINAL';q('result').className='result'});const box=[...d.querySelectorAll('.box')].find(x=>x.textContent.includes('AUTH-13 separa'));if(box){const ps=[...box.querySelectorAll('p')];const info=ps[ps.length-1];if(info)info.textContent='AUTH-14 mantiene la certificación de AUTH-13 y agrega diagnóstico continuo de contraste, bordes, spread y Δ. El diagnóstico es informativo: CVC sólo se habilita con identidad 36/36 y autenticidad óptica de sesión.'}}catch(e){q('result').textContent='DIAGNÓSTICO: error al enlazar AUTH-13';q('result').className='result bad';console.error(e)}};</script></body></html>
