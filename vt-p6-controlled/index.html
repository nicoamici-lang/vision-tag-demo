<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VT-P6 DIAGNOSTICO ARUCO</title><style>body{font-family:Arial;background:#07130f;color:#fff;margin:0;padding:16px}.w{max-width:900px;margin:auto}.c{background:#10231c;border:1px solid #315445;border-radius:16px;padding:14px;margin:12px 0}.tag{background:#b8ff43;color:#07130f;font-weight:800;padding:7px 11px;border-radius:99px;display:inline-block}.row{padding:10px;margin:7px 0;border-radius:9px;background:#172d25}.yes{background:#234d38}.no{background:#652b2b}.warn{background:#5c4b1d}button{width:100%;padding:14px;border:0;border-radius:10px;background:#b8ff43;font-size:17px;font-weight:800}.cam video{width:100%;border-radius:12px;background:#000}.mono{font-family:monospace;font-size:14px;word-break:break-word}</style></head><body><div class="w"><span class="tag">VT-P6 · DIAGNÓSTICO API</span><h1>¿Qué parte de ArUco tiene realmente el celular?</h1><p>Esta prueba no intenta leer el VT. Primero identifica exactamente qué funciones ArUco expone este OpenCV.js.</p><div class="c"><div id="cv" class="row warn">Cargando OpenCV.js…</div><div id="tests"></div><div id="summary" class="row warn">Esperando OpenCV.</div></div><div class="c"><button id="start">ACTIVAR CÁMARA</button><video id="v" playsinline autoplay muted></video><div id="cam" class="row warn">Cámara sin iniciar.</div></div></div><script>function add(name,val){let d=document.createElement('div');d.className='row '+(val?'yes':'no');d.innerHTML=(val?'✓ ':'✕ ')+'<b>'+name+'</b> : '+(val?'SÍ':'NO');document.getElementById('tests').appendChild(d)}function exists(path){try{let x=cv;for(const p of path.split('.'))x=x[p];return typeof x!=='undefined'&&x!==null}catch(e){return false}}function diagnose(){document.getElementById('cv').className='row yes';document.getElementById('cv').textContent='✓ OpenCV.js cargado';let names=['getPredefinedDictionary','DICT_6X6_50','ArucoDetector','DetectorParameters','detectMarkers','aruco','aruco.ArucoDetector','aruco.DetectorParameters','aruco.detectMarkers'];let found={};names.forEach(n=>{found[n]=exists(n);add(n,found[n])});let callable=false,msg='';try{if(found.getPredefinedDictionary&&found.DICT_6X6_50){let dic=cv.getPredefinedDictionary(cv.DICT_6X6_50);callable=!!dic;if(dic&&dic.delete)dic.delete();msg='Diccionario DICT_6X6_50 creado correctamente.'}}catch(e){msg='Error al crear diccionario: '+e.message}let s=document.getElementById('summary');if(callable&&(found.ArucoDetector||found['aruco.ArucoDetector']||found.detectMarkers||found['aruco.detectMarkers'])){s.className='row yes';s.textContent='✓ HAY DICCIONARIO + MOTOR DE DETECCIÓN. Siguiente paso: lectura ArUco real. '+msg}else if(callable){s.className='row warn';s.textContent='⚠ HAY DICCIONARIO, PERO NO APARECE UN MOTOR DE DETECCIÓN ArUco UTILIZABLE. '+msg}else{s.className='row no';s.textContent='✕ No se pudo crear el diccionario. '+msg}}window.Module={onRuntimeInitialized:diagnose};</script><script async src="https://docs.opencv.org/4.x/opencv.js"></script><script>let v=document.getElementById('v');document.getElementById('start').onclick=async()=>{try{let s=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});v.srcObject=s;await v.play();let c=document.getElementById('cam');c.className='row yes';c.textContent='✓ Cámara activa'}catch(e){let c=document.getElementById('cam');c.className='row no';c.textContent='✕ Cámara: '+e.message}};</script></body></html>
