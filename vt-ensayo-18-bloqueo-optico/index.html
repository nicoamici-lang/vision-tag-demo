<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VT-18 Bloqueo óptico</title><style>body{font-family:Arial;background:#07130f;color:#fff;padding:24px;text-align:center}h1{margin-top:18vh}p{font-size:18px}</style><h1>VISIÓN TAG · ENSAYO VT-18</h1><p id="m">Cargando lector y bloqueo óptico…</p><script>
(async()=>{try{
let h=await fetch('../vt-ensayo-17-seguimiento-subpixel/index.html?vt18=1',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('VT-17 '+r.status);return r.text()});
h=h.replaceAll('VT-17 Seguimiento subpíxel','VT-18 Bloqueo óptico').replaceAll('VISIÓN TAG · ENSAYO VT-17','VISIÓN TAG · ENSAYO VT-18').replace('Seguimiento subpíxel desde la primera geometría exacta 0/36. Cámara estable de VT-16. Sólo 0/36 suma; 10/10 valida.','Bloqueo óptico desde el primer 0/36: después de adquirir una lectura exacta, prioriza una búsqueda local corta alrededor de la geometría anterior. Sólo 0/36 suma; 10/10 valida.');
// Menos hipótesis alrededor del ancla: permite seguir el movimiento cuadro a cuadro sin gastar el tiempo en 100+ rectificaciones.
h=h.replace(/function variants\(p\)\{.*?return out\}/s,`function variants(p){let out=[{p:p.map(z=>({...z})),label:'LOCK BASE'}];for(const u of[.45,.9,1.35]){for(const [dx,dy] of[[-u,0],[u,0],[0,-u],[0,u],[-u,-u],[u,-u],[u,u],[-u,u]])out.push({p:p.map(z=>({x:z.x+dx,y:z.y+dy})),label:'LOCK '+u.toFixed(2)})}for(const s of[.994,1.006])out.push({p:hyp(p,s),label:'LOCK ESC '+s.toFixed(3)});return out}`);
// Tras adquirir ancla, no mezcla búsqueda global en cada cuadro. Sólo vuelve a global si el bloqueo se pierde.
h=h.replace("if(anchor&&anchorAge<60)tries.push(...variants(anchor));if(track)for(const s of[.96,.98,1,1.02,1.04])tries.push({p:hyp(track,s),label:'TRACK '+s.toFixed(2)});for(const c of cs.slice(0,10))for(const s of[.84,.90,.96,1,1.04,1.10,1.16])tries.push({p:hyp(c.p,s),label:'GLOBAL '+s.toFixed(2)});","if(anchor&&anchorAge<24){let ac=center(anchor),near=null,nd=1e9;for(const c of cs){let cc=center(c.p),d=Math.hypot(cc.x-ac.x,cc.y-ac.y);if(d<nd){nd=d;near=c}}let base=anchor;if(near&&nd<Math.max(18,Math.sqrt(near.a)*.35)){let nc=center(near.p),dx=nc.x-ac.x,dy=nc.y-ac.y;base=anchor.map(z=>({x:z.x+dx,y:z.y+dy}))}tries.push(...variants(base))}else{if(track)for(const s of[.96,.98,1,1.02,1.04])tries.push({p:hyp(track,s),label:'TRACK '+s.toFixed(2)});for(const c of cs.slice(0,10))for(const s of[.84,.90,.96,1,1.04,1.10,1.16])tries.push({p:hyp(c.p,s),label:'GLOBAL '+s.toFixed(2)})}");
h=h.replace("if(z.d.dist===0&&anchor&&t.label.startsWith('SUBPIX'))break","if(z.d.dist===0&&anchor&&t.label.startsWith('LOCK'))break");
h=h.replaceAll('SUBPÍXEL ACTIVO','BLOQUEO ÓPTICO ACTIVO').replaceAll('SUBPÍXEL BUSCANDO','BLOQUEO ÓPTICO BUSCANDO').replaceAll('Subpíxel: esperando ancla 0/36','Bloqueo óptico: esperando ancla 0/36').replaceAll("anchorAge>60","anchorAge>24").replaceAll("'/60'","'/24'");
document.open();document.write(h);document.close();
}catch(e){document.getElementById('m').textContent='Error al cargar VT-18: '+e.message}}
)();
</script>
