<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VT-16 Cámara estable</title><style>body{font-family:Arial;background:#07130f;color:white;padding:16px}main{max-width:820px;margin:auto}.box{background:#10231c;border:1px solid #315445;border-radius:14px;padding:14px;margin:12px 0}.ok{background:#234d38}.wait{background:#5c4b1d}.bad{background:#6a2340}.s{padding:10px;border-radius:9px;margin:7px 0}button{width:100%;padding:14px;border:0;border-radius:10px;font-weight:800;font-size:17px;background:#b8ff43}video{width:100%;border-radius:12px;background:#000}</style><main><h1>VISIÓN TAG · ENSAYO VT-16</h1><p>Prueba de arranque estable de cámara antes de reactivar el ancla móvil.</p><div class="box"><div id="cam" class="s wait">1. Cámara: esperando</div><div id="perm" class="s wait">2. Permiso: esperando acción</div></div><div class="box"><button id="go">ABRIR CÁMARA TRASERA</button></div><div class="box"><video id="v" playsinline muted autoplay></video></div></main><script>
const $=x=>document.getElementById(x);let stream=null;function S(i,t,c='wait'){let e=$(i);e.textContent=t;e.className='s '+c}
$('go').addEventListener('click',async()=>{try{S('cam','1. Cámara: iniciando…');S('perm','2. Solicitando permiso…');if(stream)stream.getTracks().forEach(t=>t.stop());if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)throw new Error('getUserMedia no disponible en este navegador');stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}}});const v=$('v');v.srcObject=stream;await v.play();for(let i=0;i<30&&!v.videoWidth;i++)await new Promise(r=>setTimeout(r,100));if(!v.videoWidth)throw new Error('la cámara abrió pero no entregó imagen');S('perm','✓ 2. Permiso de cámara concedido','ok');S('cam','✓ 1. CÁMARA ACTIVA · '+v.videoWidth+'×'+v.videoHeight,'ok')}catch(e){S('cam','✕ 1. Cámara: '+(e.name||'Error')+' · '+e.message,'bad');if(e.name==='NotAllowedError')S('perm','✕ 2. Permiso de cámara bloqueado','bad');else if(e.name==='NotReadableError')S('perm','✕ 2. Cámara ocupada por otra pestaña/app','bad');else S('perm','✕ 2. No se pudo iniciar la cámara','bad')}});
</script>
