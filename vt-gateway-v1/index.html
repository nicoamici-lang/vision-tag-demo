<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VISIÓN TAG · Gateway V1</title><style>body{font-family:Arial;background:#07130f;color:#fff;margin:0;padding:20px}.w{max-width:700px;margin:auto}.tag{display:inline-block;background:#b8ff43;color:#07130f;padding:8px 13px;border-radius:30px;font-weight:900}.c{background:#10231c;border:1px solid #315445;border-radius:18px;padding:18px;margin:16px 0}.ok{background:#234d38;padding:14px;border-radius:12px}.bad{background:#6a2340;padding:14px;border-radius:12px}a.b{display:block;width:100%;box-sizing:border-box;text-align:center;padding:17px;border-radius:13px;background:#b8ff43;color:#07130f;font-size:18px;font-weight:900;text-decoration:none;margin-top:12px}.muted{opacity:.75}.count{font-size:24px;font-weight:900;color:#b8ff43;margin-top:12px}</style></head><body><main class="w"><span class="tag">VISIÓN TAG · GATEWAY V1</span><h1>Identidad óptica → plataforma</h1><p>Gateway independiente: recibe el VT validado y lo deriva automáticamente a sus promociones.</p><section class="c" id="box"><div class="muted">Comprobando identidad validada…</div></section></main><script>const box=document.getElementById('box'),q=new URLSearchParams(location.search);let vt=(q.get('vt')||'').trim().toUpperCase();if(!vt){try{const x=JSON.parse(sessionStorage.getItem('vtValidated')||'null');if(x&&x.vt)vt=x.vt}catch(e){}}const valid=/^VT-AR-[A-Z]{3}-[A-Z]{3}-\d{6}$/.test(vt);if(!valid){box.innerHTML='<div class="bad"><b>No hay un VT validado.</b><br>Primero realizá la lectura óptica.</div><a class="b" href="../vt-reader-v2/">VOLVER AL LECTOR</a>'}else{const dest='../?vt='+encodeURIComponent(vt);box.innerHTML='<div class="ok"><b>✓ IDENTIDAD RECIBIDA</b><br><br>VT: '+vt+'<br>Gateway: VALIDADO</div><div class="count" id="count">Abriendo promociones…</div><p class="muted">No necesitás tocar ningún botón.</p>';setTimeout(()=>location.replace(dest),900)}</script></body></html>
